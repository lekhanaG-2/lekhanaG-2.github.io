name: Import portfolio source

on:
  push:
    paths:
      - '.github/workflows/import-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary repository
        uses: actions/checkout@v4

      - name: Import the verified portfolio files
        run: |
          git clone --branch main portfolio-main.bundle portfolio-source
          rsync -a --exclude='.git/' --exclude='.github/workflows/deploy-pages.yml' portfolio-source/ ./
          rm -rf portfolio-source
          rm -f portfolio-main.bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified portfolio source"
          git push origin main
